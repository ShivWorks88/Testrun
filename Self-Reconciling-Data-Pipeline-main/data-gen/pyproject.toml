[project]
name = "reconcile-datagen"
version = "0.1.0"
description = "Synthetic EHR / LIS / Billing source replicas for the Self-Reconciling Data Pipeline POC"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2", "Faker>=30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datagen"]

[tool.setuptools.package-data]
datagen = ["schema.sql"]
