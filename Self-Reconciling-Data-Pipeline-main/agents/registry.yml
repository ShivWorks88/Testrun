# Agent registry: every agent, model and prompt version is pinned here and recorded with each call.
# Agents are advisory only: they read masked views and propose catalog actions; the engine decides.
# Status: policy.yml agents.enabled stays false until residency and BAA coverage are confirmed in writing.
# Model access for sa-agents was granted on 2026-10-26 for SYNTHETIC-DATA POC use only (owner decision;
# Security confirmation pending). CI (scripts/check_policy.py) fails on retired models and non-Mumbai regions.
#
# 2026-10-26: Gemini 2.5 (pro / flash / flash-lite) was retired on Vertex AI on 2026-10-20.
#   Tested in asia-south1 as sa-agents: gemini-3.5-flash answers; gemini-3.5-flash-lite exists (429 quota on
#   day 1); gemini-3.1-flash-lite, gemini-3-flash, gemini-3.1-pro are not served there. gemini-3.8-flash is
#   global / us / eu only, so it is NOT used (India residency).

agents:
  - id: diagnosis
    version: "0.2.0"
    phase: 5
    model: gemini-3.5-flash          # was gemini-2.5-pro (retired 2026-10-20)
    region: asia-south1
    model_retires: null              # set when Google announces a date; CI fails once it has passed
    prompt_version: diag-v2          # v2: allowed actions are sent with their catalog descriptions
    token_budget: 16000
    thinking_budget: 512             # 3.x models think before answering; output needs room after that
    timeout_seconds: 20
    reads: [incident_context_bundle, masked_views]
    may_propose: [reextract_from_raw, rebuild_partition, link_unknown_member, wait_and_recheck, escalate]

  - id: communication
    version: "0.2.0"
    phase: 5
    model: gemini-3.5-flash-lite     # was gemini-2.5-flash (retired); fall back to gemini-3.5-flash if quota-limited
    region: asia-south1
    model_retires: null
    prompt_version: comms-v1
    token_budget: 4000
    thinking_budget: 0
    timeout_seconds: 10
    reads: [incident_record]
    may_propose: []                  # writes messages only: counts and evidence references, never identifiers
