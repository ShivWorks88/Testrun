# Phase 6 pkg 4 — mappings written by the recovery engine ONLY after a data owner approved them.
# Kept apart from _sources.yml (that file is generated by scripts/gen_dbt_sources.py).
version: 2

sources:
  - name: engine_maps
    description: Approved mappings the engine applies through staging (raw is never changed).
    schema: ops
    tables:
      - name: patient_remaps
        description: "Retired MPI patient ID → surviving ID, one row per approved retired ID (approval_id)."
